name: Build & Deploy to Render (via GHCR)

# Trigger on pushes to main (change branch if you need)
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch build compatibility)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${CR_PAT}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Determine image name and tag
        id: set-image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          docker build --pull -t "${{ steps.set-image.outputs.image }}" .
          docker push "${{ steps.set-image.outputs.image }}"

  deploy-to-render:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Get pushed image
        id: get_image
        run: echo "IMAGE=${{ needs.build-and-push.outputs.image }}" >> $GITHUB_OUTPUT

      - name: Check for existing Render service
        id: find_service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -e
          # Query Render for services (paginated)
          echo "Querying Render for a service named futflip-tracker..."
          SERVICES_JSON=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" "https://api.render.com/v1/services")
          echo "$SERVICES_JSON" | jq '.[].name' > /dev/null || true
          # Try to find service id by name
          SERVICE_ID=$(echo "$SERVICES_JSON" | jq -r '.[] | select(.name=="futflip-tracker") | .id' || true)
          if [ -n "$SERVICE_ID" ]; then
            echo "Found Render service with id: $SERVICE_ID"
            echo "service_id=$SERVICE_ID" >> $GITHUB_OUTPUT
          else
            echo "SERVICE_NOT_FOUND=true" >> $GITHUB_OUTPUT
            echo "No Render service named futflip-tracker was found in your Render account."
            echo
            echo "Please create the service in the Render dashboard (New → Web Service → Connect repo → choose futflip-tracker → Environment: Docker)."
            echo "Once the service exists, re-run this workflow (push a commit) and this job will trigger a deploy."
          fi

      - name: Trigger Render image deploy
        if: steps.find_service.outputs.service_id != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -e
          SERVICE_ID="${{ steps.find_service.outputs.service_id }}"
          IMAGE="${{ needs.build-and-push.outputs.image }}"
          echo "Triggering deploy on Render for service id: $SERVICE_ID with image: $IMAGE"
          # POST a new deploy with the image; Render expects an 'image' field for image deploys
          DEPLOY_RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE}\"}")
          echo "Render deploy response:"
          echo "$DEPLOY_RESPONSE"
          # Optionally poll the deploy status (simple)
          DEPLOY_ID=$(echo "$DEPLOY_RESPONSE" | jq -r '.id // empty')
          if [ -n "$DEPLOY_ID" ]; then
            echo "Started deploy id: $DEPLOY_ID. Polling status for up to ~10 minutes..."
            for i in $(seq 1 60); do
              STATUS=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" | jq -r '.status // empty')
              echo "Deploy status: $STATUS"
              if [ "$STATUS" = "success" ]; then
                echo "Deploy succeeded."
                break
              fi
              if [ "$STATUS" = "failed" ]; then
                echo "Deploy failed; check Render dashboard logs."
                break
              fi
              sleep 10
            done
          else
            echo "Could not determine deploy id from response; check Render dashboard."
          fi

      - name: Print helpful message when service is missing
        if: steps.find_service.outputs.service_id == '' || steps.find_service.outputs.SERVICE_NOT_FOUND == 'true'
        run: |
          echo "Render service futflip-tracker not found. Please create it in Render dashboard:"
          echo "1) Go to https://dashboard.render.com -> New -> Web Service"
          echo "2) Connect to your GitHub account and choose repository: ${GITHUB_REPOSITORY}"
          echo "3) Branch: main; Environment: Docker; click Create Web Service"
          echo "After that, re-run this workflow by pushing any commit to main."
